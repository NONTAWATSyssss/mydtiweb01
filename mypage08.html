<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- HTML Element: Form (Block TAG) + Form แบบป้อน/Form แบบเลือก/Form แบบกดปุ่ม (Inline TAG) -->
    <Form action=" " method=" ">
        <label for="">ฃื่อ - นามสกุล</label>
        <input type="text" name="" id="" placeholder="กรอกชื่อ - นามสกุล"><br><br>
        <label for="">อายุ</label>
        <input type="number" name="" id="" placeholder="กรอกอายุ"><br><br>
        <label for="">อีเมล</label>
        <input type="email" name="" id="" placeholder="example@gmail.com"><br><br>
        <label for="">รหัสผ่าน</label>
        <input type="password" name="" id="" placeholder="กรอกรหัสผ่าน"><br><br>
        <label for="">ประวัติส่วนตัว</label>
        <textarea name="" id="" placeholder="กรอกประวัติส่วนตัว"></textarea><br><br>

        <!-- แบบเลือก -->
        <label for="">เพศ</label>
        <input type="radio" name="sex" id="">ชาย
        <input type="radio" name="sex" id="">หญิง
        <input type="radio" name="sex" id="">LBGTQ+
        <input type="radio" name="sex" id="" checked>ไม่ระบุ<br><br>

        <label for="">จังหวัดที่เกิด</label>
        <select name="" id="">
            <option value="">กรุงเทพมหานคร</option>
            <option value="">นนทบุรี</option>
            <option value="">ปทุมธานี</option>    
            <option value="">สมุทรปราการ</option>
        </select><br><br>

        <label for="">อาหารที่ชอบ</label>
        <input type="checkbox" name="" id="">KFC
        <input type="checkbox" name="" id="">Pizza
        <input type="checkbox" name="" id="">Burger
        <input type="checkbox" name="" id="">Sushi
        <input type="checkbox" name="" id="">ไม่ระบุ<br><br>

        <label for="">วันเดือนปีเกิด</label>
        <input type="date" name="" id=""><br><br>

        <label for="">เวลาเกิด</label>
        <input type="time" name="" id=""><br><br>

        <label for="">วันเวลาทำงาน</label>
        <input type="datetime-local" name="" id=""><br><br>

        <label for="">เลือกไฟล์</label>
        <input type="file" name="" id="" accept=".doc, .docx, .pdf"><br><br>

        <label for="">เลือกรูปภาพ</label>
        <input type="file" name="" id="" accept="image/*"><br><br>

        <input type="Submit" value="ตกลง">
        <input type="reset" value="ล้างค่า"><br><br>

        <button>ตกลง</button>
        <button>ล้างค่า</button>

    </Form>
</body>
</html>
